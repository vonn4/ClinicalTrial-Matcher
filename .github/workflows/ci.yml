name: CI — no external AI calls
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate local launcher syntax and CLI
        run: |
          python -m py_compile run_local.py
          python run_local.py --help
      - name: Run backend tests (offline only)
        env:
          ENABLE_LIVE_AI: 'false'
        run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser smoke tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise real React UI against controlled API responses
        working-directory: frontend
        run: npm run test:e2e
